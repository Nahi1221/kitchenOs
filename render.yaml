services:
  - type: web
    name: kitchenos-backend
    env: python
    rootDir: "."
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin_if_needed
    startCommand: gunicorn kitchenos.wsgi:application --preload --log-file - --log-level info
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: kitchenos.settings_prod
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: FRONTEND_URL
        value: https://kitchenos-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://kitchenos-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kitchenos-frontend.vercel.app
      - key: ADMIN_EMAIL
        value: admin@kitchenos.app
      - key: ADMIN_PASSWORD
        value: ChangeMeNow123!
      - key: SECRET_KEY
        value: django-insecure-REPLACE-WITH-RANDOM-STRING
